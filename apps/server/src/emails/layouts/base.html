<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="color-scheme" content="light" />
  <meta name="supported-color-schemes" content="light" />
  <title>{{title}}</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
    .body {
      margin: 0;
      padding: 0;
      background-color: {{brand.background}};
      font-family: {{{brand.fontFamily}}};
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }
    .outer {
      width: 100%;
      background-color: {{brand.background}};
      min-height: 100vh;
    }
    .outer-pad { padding: 40px 16px; }
    .card {
      width: 100%;
      max-width: 480px;
      background-color: {{brand.white}};
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(36, 36, 36, 0.08);
    }
    .accent {
      height: 4px;
      background: linear-gradient(90deg, {{brand.purple}} 0%, #673888 50%, #0392cf 100%);
      font-size: 0;
      line-height: 0;
    }
    .content { padding: 24px 32px 32px; }
    .h1 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.3;
      color: {{brand.slate800}};
      text-align: center;
    }
    .h1-left {
      text-align: left;
      font-size: 22px;
      margin-bottom: 12px;
    }
    .lead {
      margin: 0 0 28px;
      font-size: 14px;
      line-height: 1.5;
      color: {{brand.slate600}};
      text-align: center;
    }
    .muted {
      color: {{brand.slate800}};
      font-weight: 600;
    }
    .code-box {
      padding: 20px 24px;
      background-color: {{brand.background}};
      border-radius: 12px;
      border: 1px solid #e5e7eb;
    }
    .code-label {
      margin: 0 0 6px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: {{brand.gray}};
    }
    .code {
      margin: 0;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: {{brand.black}};
      font-family: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
    }
    .expiry {
      margin: 24px 0 0;
      font-size: 14px;
      line-height: 1.5;
      color: {{brand.slate600}};
      text-align: center;
    }
    .accent-text {
      color: {{brand.purple}};
      font-weight: 600;
    }
    .fine {
      margin: 12px 0 0;
      font-size: 13px;
      line-height: 1.5;
      color: {{brand.slate500}};
      text-align: center;
    }
    .body-text {
      margin: 0;
      font-size: 15px;
      line-height: 1.6;
      color: {{brand.slate600}};
      white-space: pre-wrap;
    }
    .p {
      margin: 0 0 16px;
      font-size: 15px;
      line-height: 1.6;
      color: {{brand.slate600}};
      text-align: left;
    }
    .link {
      color: {{brand.purple}};
      font-weight: 600;
      text-decoration: none;
    }
    .sign {
      margin: 24px 0 0;
      font-size: 15px;
      line-height: 1.6;
      color: {{brand.slate800}};
    }
    .btn-wrap { margin-top: 28px; }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: {{brand.purple}};
      color: {{brand.white}};
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 10px;
    }
    .card-foot {
      padding: 20px 32px 28px;
      border-top: 1px solid #f0f0f0;
      background-color: #fafafa;
    }
    .card-foot-text {
      margin: 0;
      font-size: 12px;
      line-height: 1.6;
      color: {{brand.slate400}};
      text-align: center;
    }
    .legal {
      margin: 24px 0 0;
      font-size: 11px;
      line-height: 1.5;
      color: {{brand.slate400}};
      text-align: center;
    }
  </style>
</head>
<body class="body">
  <table role="presentation" class="outer" cellpadding="0" cellspacing="0" border="0" width="100%">
    <tr>
      <td align="center" class="outer-pad">
        <table role="presentation" class="card" cellpadding="0" cellspacing="0" border="0" width="100%">
          {{> header}}
          {{> @partial-block}}
        </table>
        {{> footer}}
      </td>
    </tr>
  </table>
</body>
</html>
