packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@prisma/engines': true
  '@sentry/cli': true
  esbuild: true
  prisma: true
  spawn-sync: true
  unrs-resolver: true
# Security floors for transitive dependencies flagged by `pnpm audit --prod`.
# Remove an entry once the parent package ships a release that resolves to a patched version on its own.
overrides:
  body-parser: '>=2.4.0'
  proxy-addr: '>=2.0.8'
  qs: '>=6.16.1'
  undici: '>=7.30.1'
  fast-uri: '>=3.1.9'
  source-map-js: '>=1.2.2'
  deepmerge-ts: '>=8.0.0'
  mysql2: '>=3.22.0'
  hono: '>=4.12.34'
  '@hono/node-server': '>=2.1.3'
  valibot: '>=1.4.2'
