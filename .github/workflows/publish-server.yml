name: Publish server image

# Runs only after the Tests workflow succeeded for a push to main, so a red
# commit never reaches :latest.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build, scan and push
    # `event == push` keeps PR runs (including forks that name a branch `main`) out.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the commit that passed the tests
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/spacedrep-server
          # workflow_run's github.sha is main's HEAD, not the tested commit.
          tags: |
            type=raw,value=${{ github.event.workflow_run.head_sha || github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Build image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/server/Dockerfile
          target: production
          load: true
          tags: spacedrep-server:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fixable critical findings block the push. Fixable high findings are
      # tracked under roadmap 1.6 (dependency hygiene) before this gate tightens.
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: spacedrep-server:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push image with provenance and SBOM
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/server/Dockerfile
          target: production
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
