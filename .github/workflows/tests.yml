name: Tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  FORCE_COLOR: 1
  NODE_ENV: test

jobs:
  changes:
    name: Changed files
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.filter.outputs.unit }}
      integration: ${{ steps.filter.outputs.integration }}
      e2e: ${{ steps.filter.outputs.e2e }}
      image: ${{ steps.filter.outputs.image }}
      backup: ${{ steps.filter.outputs.backup }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Decide which test suites to run
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/changed-suites.sh

  typecheck:
    name: Typecheck
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Initialize Node.js & dependencies
        uses: ./.github/actions/init-node

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Typecheck
        run: pnpm typecheck

  format:
    name: Format
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Initialize Node.js & dependencies
        uses: ./.github/actions/init-node

      - name: Check formatting
        run: pnpm format:check

  build:
    name: Build client
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Initialize Node.js & dependencies
        uses: ./.github/actions/init-node

      - name: Build client
        run: pnpm --filter spaced_rep_pwa_client build

  image-smoke:
    name: Server image boots
    needs: changes
    if: needs.changes.outputs.image == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Build the production image and assert /health
        run: infra/smoke/boot-image.sh

  backup-drill:
    name: Backup restore drill
    needs: changes
    if: needs.changes.outputs.backup == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Back up a seeded database, restore it and compare row counts
        run: infra/smoke/backup-restore.sh

  lint:
    name: Lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Initialize Node.js & dependencies
        uses: ./.github/actions/init-node

      - name: Lint
        run: pnpm lint

  audit:
    name: Dependency audit
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Initialize Node.js & dependencies
        uses: ./.github/actions/init-node

      - name: Fail on high or critical advisories in production dependencies
        run: pnpm audit:prod

  knip:
    name: Knip
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Initialize Node.js & dependencies
        uses: ./.github/actions/init-node

      - name: Find unused files and dependencies
        run: pnpm knip

  unit:
    name: Unit
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Initialize Node.js & dependencies
        uses: ./.github/actions/init-node

      - name: Run unit tests with coverage
        run: pnpm test:unit --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-unit
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: Integration
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spaced_rep
          POSTGRES_PASSWORD: spaced_rep
          POSTGRES_DB: spaced_rep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spaced_rep -d spaced_rep_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://spaced_rep:spaced_rep@localhost:5432/spaced_rep_test
      REDIS_URL: redis://localhost:6379/1
    steps:
      - name: Checkout the repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Initialize Node.js & dependencies
        uses: ./.github/actions/init-node

      - name: Prepare test environment
        run: |
          cp .env.test.example .env.test
          # Override host ports for GitHub Actions service containers.
          sed -i 's|localhost:5433|localhost:5432|g' .env.test
          sed -i 's|localhost:6380|localhost:6379|g' .env.test

      - name: Generate Prisma client
        run: pnpm prisma:generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run integration tests
        run: pnpm test:integration

  e2e:
    name: E2E
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spaced_rep
          POSTGRES_PASSWORD: spaced_rep
          POSTGRES_DB: spaced_rep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spaced_rep -d spaced_rep_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://spaced_rep:spaced_rep@localhost:5432/spaced_rep_test
      REDIS_URL: redis://localhost:6379/1
    steps:
      - name: Checkout the repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Initialize Node.js & dependencies
        uses: ./.github/actions/init-node

      - name: Prepare test environment
        run: |
          cp .env.test.example .env.test
          sed -i 's|localhost:5433|localhost:5432|g' .env.test
          sed -i 's|localhost:6380|localhost:6379|g' .env.test

      - name: Generate Prisma client
        run: pnpm prisma:generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e --project=chromium

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  duplication:
    name: Duplication
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Initialize Node.js & dependencies
        uses: ./.github/actions/init-node

      - name: Check copy-paste duplication
        run: pnpm jscpd
