name: Nightly E2E

on:
  schedule:
    # 06:00 UTC — Firefox/WebKit smoke only; PR e2e stays Chromium.
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-e2e
  cancel-in-progress: true

env:
  CI: true
  FORCE_COLOR: 1
  NODE_ENV: test

jobs:
  smoke-cross-browser:
    name: Smoke Firefox and WebKit
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spaced_rep
          POSTGRES_PASSWORD: spaced_rep
          POSTGRES_DB: spaced_rep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spaced_rep -d spaced_rep_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://spaced_rep:spaced_rep@localhost:5432/spaced_rep_test
      REDIS_URL: redis://localhost:6379/1
    steps:
      - name: Checkout the repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Initialize Node.js & dependencies
        uses: ./.github/actions/init-node

      - name: Prepare test environment
        run: |
          cp .env.test.example .env.test
          sed -i 's|localhost:5433|localhost:5432|g' .env.test
          sed -i 's|localhost:6380|localhost:6379|g' .env.test

      - name: Generate Prisma client
        run: pnpm prisma:generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ff-webkit-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps firefox webkit

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps firefox webkit

      - name: Run smoke tests on Firefox and WebKit
        run: pnpm test:e2e --project=firefox --project=webkit e2e/tests/smoke

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-nightly
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
